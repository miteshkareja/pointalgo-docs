<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Activate PointAlgo</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0b0f1a 0%, #17002e 100%); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        input:focus {
            border-color: #e2ff6e !important;
            box-shadow: 0 0 15px rgba(226, 255, 110, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 antialiased">

    <div class="max-w-md w-full glass-card rounded-[3rem] p-10 text-center relative overflow-hidden shadow-2xl">
        <div class="absolute top-0 right-0 w-32 h-32 bg-[#e2ff6e]/5 blur-[60px] rounded-full"></div>
        
        <div class="w-20 h-20 bg-[#e2ff6e] rounded-full flex items-center justify-center mx-auto mb-8 shadow-[0_0_50px_rgba(226,255,110,0.3)]">
            <i class="fa-solid fa-check text-black text-3xl"></i>
        </div>

        <h1 class="text-3xl font-black italic uppercase tracking-tighter mb-2 text-white">Payment Received!</h1>
        <p class="text-slate-400 text-sm mb-10 italic">Complete the activation form below to grant your TradingView access.</p>

        <form id="activationForm" class="space-y-5 text-left relative z-10">
            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 ml-2">Account Name</label>
                <input type="text" name="Name" placeholder="John Doe" required 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white outline-none transition-all">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 ml-2">Payment Email</label>
                <input type="email" name="Email" placeholder="john@example.com" required 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white outline-none transition-all">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-[#e2ff6e] ml-2">TradingView Username</label>
                <input type="text" name="TradingView_Username" placeholder="Enter Username" required 
                    class="w-full bg-[#e2ff6e]/5 border border-[#e2ff6e]/20 rounded-2xl px-5 py-4 text-white outline-none transition-all">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 ml-2">WhatsApp Number</label>
                <input type="tel" name="Phone" placeholder="+91 00000 00000" required 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white outline-none transition-all">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-[#e2ff6e] text-black font-black py-5 rounded-2xl uppercase tracking-[0.2em] text-xs hover:scale-[1.02] active:scale-95 transition-all mt-6 shadow-[0_10px_30px_rgba(226,255,110,0.2)]">
                Activate My Access <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>

        <div id="formSuccess" class="hidden mt-4 animate-in fade-in zoom-in duration-500">
            <div class="p-6 rounded-[2rem] bg-[#e2ff6e]/10 border border-[#e2ff6e]/20">
                <p class="text-[#e2ff6e] font-bold text-sm uppercase tracking-widest mb-4">Activation Initiated</p>
                <p class="text-slate-400 text-xs leading-relaxed uppercase font-medium">
                    Access is typically granted within 2-4 hours. You will receive a notification via TradingView and WhatsApp once your scripts are ready.
                </p>
                <a href="../index.html" class="inline-block mt-8 text-[10px] font-bold text-white uppercase tracking-widest hover:text-[#e2ff6e] transition-colors border-b border-white/10 pb-1">
                    Return to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        // Your Verified Apps Script Link
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz4AGnVlvK9hXeTTMcsIKB5n1s3xp53mRFjZbbHnshX_HABK08STvUkKGBn4nIAwZiJ/exec';
        
        const form = document.getElementById('activationForm');
        const btn = document.getElementById('submitBtn');
        const success = document.getElementById('formSuccess');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Visual feedback
            btn.innerHTML = 'VERIFYING... <i class="fa-solid fa-spinner fa-spin ml-2"></i>';
            btn.disabled = true;

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: new FormData(form)
            })
            .then(() => {
                form.classList.add('hidden');
                success.classList.remove('hidden');
                console.log('Activation data sent to Paid_Customers tab.');
            })
            .catch(error => {
                btn.innerHTML = 'ERROR. TRY AGAIN.';
                btn.disabled = false;
                alert('Submission Error. Please try again or contact hello@pointalgo.com');
                console.error('Error!', error.message);
            });
        });
    </script>
</body>
</html>
