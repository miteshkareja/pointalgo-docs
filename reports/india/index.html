<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GJZXB11LLJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GJZXB11LLJ');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PointAlgo | India Performance Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            background-color: #1a1f2c; 
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .metric-card { background: #252b39; border-radius: 20px; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.05); }
        .chart-container { background: #252b39; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .text-emerald { color: #10b981; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-8">
        
        <div class="chart-container shadow-2xl">
            <div class="absolute top-6 right-8 z-10 text-right">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Total Profit</p>
                <p id="currentEquity" class="text-3xl font-bold text-emerald">₹0</p>
            </div>
            <div style="height: 380px;">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="px-2">
            <h1 id="stratName" class="text-4xl font-bold italic tracking-tight mb-1 text-white">FIB_STRATEGY</h1>
            <p id="timeFrame" class="text-xl text-slate-400 font-medium">Loading details...</p>
        </div>

        <div class="grid grid-cols-2 gap-5">
            <div class="metric-card shadow-xl border border-transparent hover:border-emerald/20 transition">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-2">Return</p>
                <p id="statReturn" class="text-2xl font-bold text-emerald">+0%</p>
            </div>
            <div class="metric-card shadow-xl border border-transparent hover:border-red-400/20 transition">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-2">Max Drawdown</p>
                <p id="statDD" class="text-2xl font-bold text-red-400">-0%</p>
            </div>
            <div class="metric-card shadow-xl border border-transparent hover:border-white/10 transition">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-2">Win Rate</p>
                <p id="statWin" class="text-2xl font-bold text-white">0%</p>
            </div>
            <div class="metric-card shadow-xl border border-transparent hover:border-white/10 transition">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-2">Total Trades</p>
                <p id="statTrades" class="text-2xl font-bold text-white">0</p>
            </div>
        </div>

        <p class="text-center text-[10px] text-slate-600 uppercase tracking-[0.3em] pt-4">
            Institutional Audit • Verified by PointAlgo
        </p>
    </div>

    <script>
        // YOUR LIVE API URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbyJq9QOlnT1khcsspVsaqf7edo57m-ecKqEMrH4txKKidPbHRf3SweZjvFzGki6VIcESA/exec';
        const STARTING_CAPITAL = 50000; // Change this as per your Nifty margin

        async function loadDashboard() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                // 1. Filter for FIB_STRATEGY
                const trades = data.filter(t => t.Strategy_ID === 'FIB_STRATEGY');

                if (trades.length === 0) {
                    document.getElementById('stratName').innerText = "Strategy ID Missing";
                    return;
                }

                // 2. Set Labels
                document.getElementById('stratName').innerText = trades[0].Symbol;
                document.getElementById('timeFrame').innerText = trades[0].Time_frame;

                // 3. Stats Engine
                let cumulativeProfit = 0;
                let wins = 0;
                let maxDD = 0;
                const labels = [];
                const profits = [];

                trades.forEach(t => {
                    cumulativeProfit += parseFloat(t['Profit Amount']);
                    if (parseFloat(t.PnL_Points) > 0) wins++;
                    
                    const dd = Math.abs(parseFloat(t.Max_Drawdown));
                    if (dd > maxDD) maxDD = dd;

                    labels.push(t.Exit_Time);
                    profits.push(cumulativeProfit);
                });

                // 4. Update UI
                document.getElementById('currentEquity').innerText = "₹" + Math.round(cumulativeProfit).toLocaleString('en-IN');
                document.getElementById('statReturn').innerText = "+" + Math.round((cumulativeProfit / STARTING_CAPITAL) * 100) + "%";
                document.getElementById('statDD').innerText = "-" + maxDD.toFixed(1) + "%";
                document.getElementById('statWin').innerText = ((wins / trades.length) * 100).toFixed(1) + "%";
                document.getElementById('statTrades').innerText = trades.length;

                // 5. Build Chart
                const ctx = document.getElementById('mainChart').getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, 0, 400);
                grad.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
                grad.addColorStop(1, 'rgba(16, 185, 129, 0)');

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: profits,
                            borderColor: '#10b981',
                            borderWidth: 3,
                            backgroundColor: grad,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { display: false }, y: { display: false } }
                    }
                });

            } catch (err) {
                console.error("Dashboard failed to load:", err);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
