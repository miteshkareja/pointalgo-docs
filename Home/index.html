<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <title>PointAlgo | High-Frequency Quant Trading Intelligence</title>
    <meta name="description" content="Institutional-grade quantitative trading tools and automated strategy frameworks for professional traders.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background: linear-gradient(135deg, #3f000f 0%, #17002e 50%, #0a0026 100%);
            background-attachment: fixed;
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .glass-nav { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="antialiased">

    <nav class="glass-nav fixed w-full z-50 top-0 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-24">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="window.location.href='index.html'">
                    <img src="strategies/Pointalgo_logo1.png" alt="PointAlgo Logo" class="max-h-16 md:max-h-20 w-auto h-auto block">
                </div>

                <div class="hidden md:flex items-center space-x-10">
                    <a href="index.html" class="text-base font-bold text-blue-400 border-b-2 border-blue-400 pb-1">Home</a>
                    <a href="strategies/index.html" class="text-base font-semibold text-slate-300 hover:text-white transition-colors">Indicator & Strategy</a>
                    <a href="docs/index.html" class="text-base font-semibold text-slate-300 hover:text-white transition-colors">Documents</a>
                    <a href="#" class="text-base font-semibold text-slate-300 hover:text-white transition-colors">Free Toolkit</a>
                    <a href="#" class="text-base font-semibold text-slate-300 hover:text-white transition-colors">Discord</a>
                </div>
            </div>
        </div>
    </nav>

   <main class="pt-48 pb-32 px-6 lg:px-8 max-w-7xl mx-auto">
        <div class="text-center mb-20 space-y-6">
            <h1 class="text-5xl md:text-8xl font-black text-white leading-tight tracking-tighter">
                Trade with Structure.<br>
                Execute with <span class="text-[#e2ff6e]">Precision</span>
            </h1>
            <p class="text-xl md:text-2xl text-slate-400 max-w-3xl mx-auto font-light">
                A complete quant trading infrastructure to build, deploy, and automate disciplined strategies.
            </p>
            <div class="pt-4">
                <a href="#features" class="inline-block bg-black hover:bg-slate-900 text-white border border-white/20 px-12 py-4 rounded-xl font-bold text-lg transition-all shadow-2xl">
                    Learn More
                </a>
            </div>
        </div>

        <div class="relative max-w-5xl mx-auto">
            
            <div class="glass-card rounded-[2.5rem] p-2 shadow-[0_0_100px_rgba(0,0,0,0.8)] border-white/5 overflow-hidden z-10 relative bg-slate-900/50 min-h-[300px] md:min-h-[500px] flex items-center justify-center">
                <img src="strategy_herosection1.gif" alt="Main Dashboard" class="rounded-[2rem] w-full h-auto opacity-90 block">
            </div>

            <div class="absolute -top-12 -right-4 md:-right-24 w-48 md:w-80 z-30 animate-float-slow">
                <div class="glass-card p-1 rounded-2xl shadow-2xl border-emerald-500/30 overflow-hidden">
                    <img src="alert_popup.png" alt="Trade Alert" class="rounded-xl w-full h-auto block">
                </div>
            </div>

            <div class="absolute -bottom-12 -left-4 md:-left-24 w-48 md:w-80 z-20 animate-slide-loop">
                <div class="glass-card p-1 rounded-2xl shadow-2xl border-purple-500/20 overflow-hidden">
                    <img src="left_stats.png" alt="Market Stats" class="rounded-xl w-full h-auto block">
                </div>
            </div>

        </div>
    </main>

    <style>
        /* Floating Animation for Top-Right */
        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-15px) translateX(10px); }
        }
        .animate-float-slow { animation: float 7s ease-in-out infinite; }

        /* Sliding Loop for Bottom-Left */
        @keyframes slideLoop {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(-15px) translateY(10px); }
        }
        .animate-slide-loop { animation: slideLoop 9s ease-in-out infinite; }
    </style>
    
</body>
</html>
