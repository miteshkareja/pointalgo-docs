<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Us | PointAlgo</title>
  <meta name="description" content="Learn about PointAlgo, our leadership, and the journey from retail trading research to enterprise-grade quantitative systems." />
  <link rel="icon" type="image/png" href="favicon.png" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GJZXB11LLJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GJZXB11LLJ');
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05080f;
      --s1:#090e1a;
      --s2:#0d1424;
      --s3:#111b30;
      --bdr:rgba(255,255,255,.07);
      --bdr-m:rgba(255,255,255,.12);
      --bdr-h:rgba(255,255,255,.20);
      --div:rgba(255,255,255,.04);

      --txt:#dde6f0;
      --muted:#8a9bb5;
      --faint:#2c3d52;

      --lime:#c9f135;
      --lime-g:rgba(201,241,53,.28);
      --lime-d:rgba(201,241,53,.09);

      --teal:#00d4c8;
      --teal-g:rgba(0,212,200,.22);
      --teal-d:rgba(0,212,200,.09);

      --cobalt:#3b8ff5;
      --cobalt-d:rgba(59,143,245,.09);

      --emerald:#10e88e;
      --emerald-d:rgba(16,232,142,.09);

      --pink:#ec4899;
      --pink-d:rgba(236,72,153,.10);

      --amber:#f59e0b;
      --amber-d:rgba(245,158,11,.09);

      --fd:Inter,system-ui,sans-serif;
      --fh:"Space Grotesk",Inter,sans-serif;
      --ease:cubic-bezier(.16,1,.3,1);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{
      -webkit-font-smoothing:antialiased;
      scroll-behavior:smooth;
      scroll-padding-top:90px;
    }
    body{
      font-family:var(--fd);
      font-size:16px;
      color:var(--txt);
      background:var(--bg);
      line-height:1.65;
      overflow-x:hidden;
    }
    img{display:block;max-width:100%;height:auto}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}

    .bg-canvas{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      overflow:hidden;
    }
    .bg-orb{
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      opacity:.52;
    }
    .bg-orb-1{
      width:680px;height:680px;top:-180px;left:-120px;
      background:radial-gradient(circle, rgba(0,212,200,.16) 0, transparent 70%);
      animation:orb1 20s ease-in-out infinite alternate;
    }
    .bg-orb-2{
      width:560px;height:560px;top:6%;right:-80px;
      background:radial-gradient(circle, rgba(201,241,53,.10) 0, transparent 70%);
      animation:orb2 24s ease-in-out infinite alternate;
    }
    .bg-orb-3{
      width:500px;height:500px;bottom:8%;left:18%;
      background:radial-gradient(circle, rgba(59,143,245,.10) 0, transparent 70%);
      animation:orb3 26s ease-in-out infinite alternate;
    }
    .bg-orb-4{
      width:380px;height:380px;bottom:-60px;right:10%;
      background:radial-gradient(circle, rgba(236,72,153,.08) 0, transparent 70%);
      animation:orb4 22s ease-in-out infinite alternate;
    }
    .bg-grid{
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size:60px 60px;
      opacity:.45;
    }
    .bg-vig{
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse 130% 110% at 50% 50%, transparent 28%, rgba(5,8,15,.84) 100%);
    }

    @keyframes orb1 { to { transform:translate(70px,110px); } }
    @keyframes orb2 { to { transform:translate(-55px,85px); } }
    @keyframes orb3 { to { transform:translate(95px,-75px); } }
    @keyframes orb4 { to { transform:translate(-75px,-55px); } }

    .wrap{position:relative;z-index:1}

    .nav{
      position:fixed;
      top:0;left:0;right:0;
      z-index:100;
      height:76px;
      background:rgba(5,8,15,.80);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      border-bottom:1px solid var(--bdr);
      transition:border-color .3s, background .3s;
    }
    .nav.scrolled{border-bottom-color:var(--bdr-m)}
    .nav-in{
      max-width:1280px;
      margin:0 auto;
      padding:0 32px;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }
    .logo img{height:56px;width:auto;display:block}
    .nav-links{display:flex;align-items:center;gap:4px}
    .nl,.dd-btn{
      font-size:15px;
      font-weight:600;
      color:var(--muted);
      padding:7px 14px;
      border-radius:7px;
      transition:color .18s, background .18s;
      letter-spacing:.01em;
    }
    .nl:hover,.dd-btn:hover,.dd:hover .dd-btn{
      color:var(--txt);
      background:rgba(255,255,255,.06);
    }
    .nl.on{color:var(--lime)}
    .dd{position:relative}
    .dd-btn{
      display:flex;
      align-items:center;
      gap:6px;
      cursor:pointer;
    }
    .dd-btn svg{
      width:10px;height:10px;opacity:.5;
      transition:transform .2s;
    }
    .dd:hover .dd-btn svg{transform:rotate(180deg)}
    .dd-menu{
      position:absolute;
      top:calc(100% + 10px);
      left:0;
      min-width:190px;
      background:var(--s2);
      border:1px solid var(--bdr-m);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 18px 52px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04) inset;
      opacity:0;
      visibility:hidden;
      transform:translateY(-6px);
      transition:opacity .18s var(--ease), visibility .18s, transform .18s var(--ease);
    }
    .dd:hover .dd-menu{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }
    .di{
      display:block;
      padding:11px 18px;
      font-size:14px;
      font-weight:500;
      color:var(--muted);
      transition:color .15s, background .15s;
    }
    .di:hover{
      color:var(--lime);
      background:rgba(255,255,255,.04);
    }
    .nav-cta{
      font-size:14px;
      font-weight:700;
      color:#050810;
      background:var(--lime);
      padding:10px 24px;
      border-radius:9px;
      white-space:nowrap;
      transition:opacity .18s, box-shadow .25s, transform .18s;
    }
    .nav-cta:hover{
      opacity:.9;
      box-shadow:0 0 32px var(--lime-g);
      transform:translateY(-1px);
    }
    .hbg{
      display:none;
      flex-direction:column;
      gap:5px;
      padding:6px;
      border-radius:6px;
    }
    .hbg span{
      width:24px;height:2px;background:var(--txt);border-radius:2px;
      display:block;transition:transform .25s,opacity .25s;
    }
    .hbg.on span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .hbg.on span:nth-child(2){opacity:0}
    .hbg.on span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .mob{
      display:none;
      position:fixed;
      top:76px;left:0;right:0;
      background:rgba(5,8,15,.97);
      backdrop-filter:blur(24px);
      border-bottom:1px solid var(--bdr-m);
      z-index:99;
      padding:18px 18px 30px;
      flex-direction:column;
      gap:2px;
    }
    .mob.on{display:flex}
    .ma{
      font-size:16px;
      font-weight:500;
      color:var(--muted);
      padding:11px 14px;
      border-radius:8px;
      transition:color .15s, background .15s;
    }
    .ma:hover{
      color:var(--txt);
      background:rgba(255,255,255,.05);
    }
    .mlbl{
      font-size:10px;
      font-weight:700;
      letter-spacing:.18em;
      color:var(--faint);
      padding:14px 14px 4px;
      text-transform:uppercase;
    }
    .m-cta{
      margin-top:14px;
      padding:14px 20px;
      text-align:center;
      background:var(--lime);
      color:#050810;
      font-weight:700;
      font-size:15px;
      border-radius:8px;
      transition:opacity .18s;
    }
    .m-cta:hover{opacity:.88}

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      padding:126px 28px 56px;
      position:relative;
    }
    .hero-in{
      max-width:1280px;
      margin:0 auto;
      width:100%;
    }
    .hero-grid{
      display:grid;
      grid-template-columns:1fr 1.02fr;
      gap:56px;
      align-items:center;
    }
    .hero-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-size:11px;
      font-weight:700;
      letter-spacing:.15em;
      text-transform:uppercase;
      color:var(--teal);
      background:linear-gradient(135deg, rgba(0,212,200,.07), rgba(201,241,53,.05));
      border:1px solid rgba(0,212,200,.20);
      border-radius:999px;
      padding:7px 18px 7px 10px;
      margin-bottom:28px;
    }
    .pulse{
      width:7px;height:7px;background:var(--teal);border-radius:50%;
      box-shadow:0 0 7px var(--teal);
      animation:pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(.6);opacity:.5}
    }

    .h1{
      font-family:var(--fh);
      font-size:clamp(2.8rem, 5vw, 5.4rem);
      font-weight:800;
      letter-spacing:-.04em;
      line-height:1.02;
      margin-bottom:24px;
      color:#fff;
    }
    .h1 .plain{display:block}
    .h1 .grad{
      display:block;
      background:linear-gradient(90deg, var(--teal) 0%, var(--lime) 50%, #fff 100%);
      background-size:200% auto;
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:gradShift 5s linear infinite;
    }
    @keyframes gradShift{
      0%{background-position:0 center}
      100%{background-position:200% center}
    }
    .h-sub{
      font-size:17px;
      color:var(--muted);
      line-height:1.72;
      max-width:620px;
      margin-bottom:16px;
    }
    .h-em{
      font-size:14px;
      color:var(--amber);
      font-style:italic;
      margin-top:4px;
    }

    .hero-side{
      position:relative;
      min-height:520px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .hero-ring{
      position:absolute;
      inset:24px;
      border-radius:36px;
      background:conic-gradient(from 180deg at 50% 50%, var(--teal), var(--lime), var(--cobalt), var(--teal));
      opacity:.15;
      filter:blur(22px);
      animation:ringSpin 13s linear infinite;
      z-index:0;
    }
    @keyframes ringSpin{
      to{transform:rotate(360deg)}
    }
    .hero-card{
      position:relative;
      z-index:2;
      width:100%;
      background:var(--s2);
      border:1px solid var(--bdr-m);
      border-radius:28px;
      padding:28px;
      box-shadow:0 12px 60px rgba(0,0,0,.68),0 0 0 1px rgba(255,255,255,.04) inset;
      overflow:hidden;
    }
    .hero-card::before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at 20% 20%, rgba(0,212,200,.08), transparent 30%),
                 radial-gradient(circle at 80% 20%, rgba(201,241,53,.06), transparent 28%),
                 radial-gradient(circle at 80% 80%, rgba(59,143,245,.08), transparent 32%);
      pointer-events:none;
    }
    .hero-stat-grid{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }
    .mini{
      background:rgba(255,255,255,.03);
      border:1px solid var(--bdr);
      border-radius:18px;
      padding:18px;
      min-height:124px;
      transition:transform .22s, border-color .22s, box-shadow .22s;
    }
    .mini:hover{
      transform:translateY(-4px);
      border-color:var(--bdr-h);
      box-shadow:0 12px 32px rgba(0,0,0,.28);
    }
    .mini .mi{
      width:42px;height:42px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;margin-bottom:14px;
      background:var(--teal-d);color:var(--teal);
      border:1px solid rgba(0,212,200,.15);
    }
    .mini:nth-child(2) .mi{background:var(--lime-d);color:var(--lime);border-color:rgba(201,241,53,.15)}
    .mini:nth-child(3) .mi{background:var(--cobalt-d);color:var(--cobalt);border-color:rgba(59,143,245,.15)}
    .mini:nth-child(4) .mi{background:var(--pink-d);color:var(--pink);border-color:rgba(236,72,153,.15)}
    .mini h4{
      font-size:15px;
      color:#fff;
      font-weight:700;
      margin-bottom:6px;
    }
    .mini p{
      font-size:13px;
      color:var(--muted);
      line-height:1.55;
    }

    .ticker-wrap{
      border-top:1px solid var(--div);
      border-bottom:1px solid var(--div);
      overflow:hidden;
      padding:11px 0;
      background:rgba(255,255,255,.01);
      position:relative;
      z-index:1;
    }
    .ticker-track{
      display:flex;
      animation:tk 28s linear infinite;
      white-space:nowrap;
    }
    .ticker-track:hover{animation-play-state:paused}
    .ti{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:0 34px;
      font-size:11.5px;
      font-weight:600;
      color:var(--faint);
      letter-spacing:.09em;
      text-transform:uppercase;
    }
    .td{
      width:4px;height:4px;background:var(--teal);border-radius:50%;opacity:.6;
    }
    @keyframes tk{
      0%{transform:translateX(0)}
      100%{transform:translateX(-50%)}
    }

    .sec{
      padding:clamp(76px, 9vw, 124px) 28px;
      position:relative;
      z-index:1;
    }
    .si{
      max-width:1280px;
      margin:0 auto;
    }
    hr.div{
      border:none;
      border-top:1px solid var(--div);
      position:relative;
      z-index:1;
    }

    .slbl{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:10.5px;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--faint);
      margin-bottom:14px;
    }
    .slbl::before{
      content:"";
      display:block;
      width:18px;height:1.5px;
      background:linear-gradient(90deg, var(--teal), var(--lime));
      border-radius:2px;
    }
    .stit{
      font-family:var(--fh);
      font-size:clamp(1.9rem, 3vw, 3.2rem);
      font-weight:800;
      letter-spacing:-.03em;
      line-height:1.1;
      color:#fff;
    }
    .a-l{color:var(--lime)}
    .a-t{color:var(--teal)}
    .a-c{color:var(--cobalt)}
    .a-p{color:var(--pink)}

    .lead{
      max-width:760px;
      font-size:16px;
      color:var(--muted);
      line-height:1.72;
      margin-top:18px;
    }

    .core-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-top:58px;
    }
    .core-card{
      position:relative;
      background:var(--s1);
      border:1px solid var(--bdr);
      border-radius:24px;
      padding:28px 24px;
      overflow:hidden;
      transition:transform .25s, border-color .25s, box-shadow .25s;
      box-shadow:0 4px 28px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.03) inset;
    }
    .core-card::before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;height:2px;
      opacity:.9;
    }
    .core-card:nth-child(1)::before{background:linear-gradient(90deg, var(--lime), var(--teal))}
    .core-card:nth-child(2)::before{background:linear-gradient(90deg, var(--teal), var(--cobalt))}
    .core-card:nth-child(3)::before{background:linear-gradient(90deg, var(--cobalt), var(--pink))}
    .core-card:hover{
      transform:translateY(-6px);
      border-color:var(--bdr-h);
      box-shadow:0 18px 40px rgba(0,0,0,.40);
    }
    .core-icon{
      width:62px;height:62px;border-radius:16px;
      display:flex;align-items:center;justify-content:center;
      margin-bottom:18px;font-size:22px;
      border:1px solid var(--bdr-m);
      background:rgba(255,255,255,.03);
    }
    .core-card:nth-child(1) .core-icon{color:var(--lime);background:var(--lime-d)}
    .core-card:nth-child(2) .core-icon{color:var(--teal);background:var(--teal-d)}
    .core-card:nth-child(3) .core-icon{color:var(--pink);background:var(--pink-d)}
    .core-name{
      font-family:var(--fh);
      font-size:1.2rem;
      font-weight:700;
      color:#fff;
      margin-bottom:4px;
    }
    .core-role{
      font-size:10px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:16px;
    }
    .core-card:nth-child(1) .core-role{color:var(--lime)}
    .core-card:nth-child(2) .core-role{color:var(--teal)}
    .core-card:nth-child(3) .core-role{color:var(--pink)}
    .core-text{
      font-size:14px;
      color:var(--muted);
      line-height:1.64;
      min-height:92px;
    }
    .core-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:18px;
      padding:11px 16px;
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      border-radius:10px;
      background:#0A66C2;
      color:#fff;
      transition:transform .18s, opacity .18s;
    }
    .core-link:hover{
      transform:translateY(-2px);
      opacity:.9;
    }

    .journey-head{
      text-align:center;
      max-width:760px;
      margin:0 auto 70px;
    }

    .timeline{
      position:relative;
      max-width:980px;
      margin:0 auto;
      padding:18px 0 18px;
    }
    .timeline-line{
      position:absolute;
      top:0;
      bottom:0;
      left:24px;
      width:2px;
      background:linear-gradient(to bottom, rgba(59,143,245,.12), rgba(201,241,53,.12), rgba(236,72,153,.12));
      overflow:hidden;
      border-radius:999px;
    }
    .timeline-progress{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:0%;
      background:linear-gradient(to bottom, var(--cobalt), var(--lime), var(--pink));
      border-radius:999px;
      box-shadow:0 0 18px rgba(201,241,53,.18);
      transition:height .14s linear;
    }

    .t-item{
      position:relative;
      display:flex;
      justify-content:flex-end;
      width:100%;
      margin-bottom:26px;
    }
    .t-item:nth-child(even){
      justify-content:flex-start;
    }
    .t-col{
      width:calc(50% - 42px);
    }
    .t-card{
      position:relative;
      background:var(--s1);
      border:1px solid var(--bdr);
      border-radius:24px;
      padding:22px 22px 20px;
      box-shadow:0 4px 28px rgba(0,0,0,.44),0 1px 0 rgba(255,255,255,.03) inset;
      overflow:hidden;
      transition:transform .25s, border-color .25s, box-shadow .25s;
    }
    .t-card:hover{
      transform:translateY(-6px);
      border-color:var(--bdr-h);
      box-shadow:0 18px 42px rgba(0,0,0,.42);
    }
    .t-card::after{
      content:"";
      position:absolute;
      inset:auto auto 0 0;
      width:100%;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
      opacity:.55;
    }

    .t-year{
      display:flex;
      align-items:flex-end;
      gap:10px;
      margin-bottom:8px;
      line-height:1;
    }
    .t-year-num{
      font-family:var(--fh);
      font-size:clamp(2rem, 3vw, 2.8rem);
      font-weight:800;
      letter-spacing:-.04em;
    }
    .t-year-tag{
      font-size:10px;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--faint);
      margin-bottom:7px;
    }
    .t-card h3{
      font-size:1rem;
      color:#fff;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:8px;
    }
    .t-card p{
      font-size:14px;
      color:var(--muted);
      line-height:1.67;
    }
